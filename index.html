<!DOCTYPE html>
<!--
  Posuying en el navegador, instalable como app (PWA).

  En un iPhone: abrir la pagina en Safari > Compartir > "Anadir a pantalla de
  inicio". Se abre a pantalla completa, sin barras del navegador, y en
  horizontal. En Android (Chrome) sale el aviso de "Instalar app".

  La pagina tiene que servirse por HTTPS (itch.io, GitHub Pages, Netlify...):
  sin HTTPS no se puede instalar ni funciona el Relay de las partidas online.
-->
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Posuying</title>
    <meta name="description" content="Terror cooperativo para jugar con amigos.">

    <!-- Pantalla del movil: sin zoom, ocupando todo -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Como app instalada -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0E1114">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- iPhone / iPad (Safari no lee todo del manifiesto) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Posuying">
    <link rel="apple-touch-icon" href="TemplateData/icons/icono-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="TemplateData/icons/icono-192.png">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">

    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="titulo">POSUYING</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="cargando">Cargando...</div>
      </div>
      <div id="unity-warning"> </div>
      <!-- En vertical se pide girar el movil: el juego es horizontal -->
      <div id="gira">Gira el movil para jugar</div>
    </div>
    <script>
      // Guarda la app para poder abrirla rapido y sin volver a descargarla entera
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      // Que el navegador no haga zoom, ni arrastre la pagina, ni saque menus al
      // mantener pulsado: con los dedos se esta jugando
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #8a1c14; color: #fff; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #6b5a12; color: #fff; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Web.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Posuying",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      // En pantallas muy densas (iPhone: 3 pixeles por punto) se dibuja a menos
      // resolucion: a resolucion completa el movil no llegaria a 30 FPS
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
